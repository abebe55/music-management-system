
services:
  - type: web
    name: musicflow-backend
    runtime: docker

    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free                     # upgrade to starter/standard for production
    autoDeploy: true               # redeploy on every push to the branch below
    branch: main

    envVars:
      - key: NODE_ENV
        value: production


      - key: MONGODB_URI
        sync: false                # set manually in Render dashboard


      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      
      - key: FRONTEND_URL
        sync: false

      # Brevo transactional email
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: MusicFlow
      - key: EMAIL_FROM_ADDRESS
        sync: false                # must match a verified Brevo sender

      # OTP settings
      - key: OTP_EXPIRES_MINUTES
        value: "10"
      - key: OTP_MAX_ATTEMPTS
        value: "5"

      # Rate limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
